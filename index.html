<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open Netflix</title>

<style>
body{
    background:#111;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
    font-family:Arial;
}

button{
    background:#E50914;
    color:white;
    border:none;
    padding:18px 40px;
    font-size:22px;
    border-radius:12px;
}
</style>
</head>
<body>

<button onclick="openNetflix()">
OPEN NETFLIX
</button>

<script>

function openNetflix(){

    location.href =
    "intent:#Intent;" +
    "action=android.intent.action.MAIN;" +
    "category=android.intent.category.LAUNCHER;" +
    "package=com.netflix.mediaclient;" +
    "end";
}

</script>

</body>
</html>
