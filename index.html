<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Netflix App Only</title>
</head>
<body style="background:black;color:white;text-align:center;padding-top:50px;font-family:Arial;">

<h2>Membuka aplikasi Netflix...</h2>

<button onclick="openNetflix()">
Buka Netflix
</button>

<script>

function openNetflix(){

    window.location.href =
    "intent://#Intent;" +
    "package=com.netflix.mediaclient;" +
    "scheme=netflix;" +
    "end";
}

setTimeout(function(){
    openNetflix();
}, 500);

</script>

</body>
</html>
